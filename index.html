<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huzur Pınarı - İlahi Çalar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- INSTAGRAM TARZI GİRİŞ ANİMASYONU --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #091921, #1b3b4f);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-content {
            text-align: center;
            color: #fff;
            animation: instagramZoom 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .app-icon {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #d4af37, #aa771c);
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            font-size: 50px;
        }

        .splash-content h1 {
            font-size: 26px;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            color: #f3e5ab;
        }

        .splash-content p {
            font-size: 13px;
            color: #a0aec0;
        }

        @keyframes instagramZoom {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- MP3 ÇALAR ANA EKRANI --- */
        .hidden {
            display: none !important;
        }

        .player-container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            text-align: center;
        }

        /* Albüm Kapağı / Logo */
        .album-art {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #d4af37, #85581a);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            border: 4px solid #475569;
            animation: pulseArt 4s infinite alternate;
        }

        @keyframes pulseArt {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        /* Parça Bilgisi */
        .track-info h2 {
            font-size: 18px;
            color: #f3e5ab;
            margin-bottom: 8px;
        }

        .track-info p {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* İlahi Sözleri Ekranı (MP3 Çalar Şarkı Sözü Alanı) */
        .lyrics-screen {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            height: 140px;
            overflow-y: auto;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 25px;
            white-space: pre-line;
        }

        /* MP3 Çalar Kontrol Tuşları */
        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .ctrl-btn {
            background: #334155;
            color: #fff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ctrl-btn:hover {
            background: #475569;
        }

        .play-pause-btn {
            background: #d4af37;
            color: #0f172a;
            width: 65px;
            height: 65px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .play-pause-btn:hover {
            background: #e6c55c;
        }
    </style>
</head>
<body>

    <!-- GİRİŞ ANİMASYONU -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="app-icon">☪</div>
            <h1>Huzur Pınarı</h1>
            <p>İlahi Çalar</p>
        </div>
    </div>

    <!-- MP3 ÇALAR ARAYÜZÜ -->
    <div id="main-content" class="hidden">
        <div class="player-container">
            <div class="album-art">☪</div>
            
            <div class="track-info">
                <h2 id="track-title">Yükleniyor...</h2>
                <p>Esmaül Hüsna İlahisi</p>
            </div>

            <!-- Şarkı Sözleri Penceresi -->
            <div class="lyrics-screen" id="lyrics-text">
                İlahi sözleri yükleniyor...
            </div>

            <!-- Çalar Tuşları (Önceki, Oynat/Durdur, Sonraki) -->
            <div class="player-controls">
                <button class="ctrl-btn" id="prev-btn" title="Önceki İlahi">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="play-btn" title="Oynat / Durdur">▶</button>
                <button class="ctrl-btn" id="next-btn" title="Sonraki İlahi">⏭</button>
            </div>
        </div>
    </div>

    <script>
        // Giriş Animasyonu
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const mainContent = document.getElementById('main-content');
                
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                mainContent.classList.remove('hidden');
            }, 2500);
        });

        // İlahi Listesi (İstediğin gibi çoğaltabilir, sözleri değiştirebilirsin)
        const ilahilerListesi = [
            {
                title: "1. Bölüm: Allah, Rahman, Rahim",
                lyrics: "Dillerde ezan, kalpte iman...\nAnılır ismiyle her an...\nGel ey gönül zikreyle Rahman...\n\nYa Allah sen başımızda tacımız,\nYa Rahman sensin bütün ilacımız,\nYa Rahim merhametin derya deniz..."
            },
            {
                title: "2. Bölüm: Kaddüs ve Selam",
                lyrics: "El-Kuddüs, El-Selam nurunla doldu âlem...\nYazmaz bunu gayrı başka bir kalem...\n\nYa Kuddüs, kalpleri tertemiz eyle,\nYa Selam, selamete erdir bizi söyle..."
            },
            {
                title: "3. Bölüm: Aziz ve Cebbar",
                lyrics: "Ya Aziz, yüceler yücesi şanlı sultan,\nSeninle dirilir mahlukat, canlanan!\n\nYa Cebbar, kırılan kalpleri onaran,\nZikrinle çarpar bu garip yürekler..."
            }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        
        const titleEl = document.getElementById('track-title');
        const lyricsEl = document.getElementById('lyrics-text');
        const playBtn = document.getElementById('play-btn');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');

        function loadTrack() {
            titleEl.textContent = ilahilerListesi[currentIndex].title;
            lyricsEl.textContent = ilahilerListesi[currentIndex].lyrics;
        }

        loadTrack();

        // Saf İnsan/İlahi Tonu Simülasyonu (Metni ilahi temposunda okuma)
        function togglePlay() {
            if (!('speechSynthesis' in window)) {
                alert("Tarayıcınız ses motorunu desteklemiyor.");
                return;
            }

            if (isPlaying) {
                window.speechSynthesis.cancel();
                isPlaying = false;
                playBtn.textContent = "▶";
            } else {
                window.speechSynthesis.cancel();
                
                // İlahi formuna uygun tonlama için metni düzenliyoruz
                const ilahiMetni = ilahilerListesi[currentIndex].title + "... " + ilahilerListesi[currentIndex].lyrics;
                const utterance = new SpeechSynthesisUtterance(ilahiMetni);
                
                utterance.lang = 'tr-TR';
                utterance.rate = 0.78; // Daha ağır, ilahi makamına yakın yavaşlıkta
                utterance.pitch = 0.8; // Daha tok, huzurlu bir ses tonu

                playBtn.textContent = "⏸";
                isPlaying = true;

                utterance.onend = () => {
                    isPlaying = false;
                    playBtn.textContent = "▶";
                };

                utterance.onerror = () => {
                    isPlaying = false;
                    playBtn.textContent = "▶";
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        playBtn.addEventListener('click', togglePlay);

        // Sonraki Parça
        nextBtn.addEventListener('click', () => {
            window.speechSynthesis.cancel();
            isPlaying = false;
            playBtn.textContent = "▶";
            
            currentIndex = (currentIndex + 1) % ilahilerListesi.length;
            loadTrack();
        });

        // Önceki Parça
        prevBtn.addEventListener('click', () => {
            window.speechSynthesis.cancel();
            isPlaying = false;
            playBtn.textContent = "▶";
            
            currentIndex = (currentIndex - 1 + ilahilerListesi.length) % ilahilerListesi.length;
            loadTrack();
        });
    </script>
</body>
</html>
