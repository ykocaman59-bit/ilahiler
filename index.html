<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlahiler ve Esmaül Hüsna</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- GİRİŞ ANİMASYONU (İnstagram Tarzı) -->
    <div id="splash-screen">
        <div class="splash-content">
            <img src="watermarked_img_14307815405814033485.png" alt="Logo" class="splash-logo">
            <h1>Huzur Pınarı</h1>
            <p>İlahiler ve Esmaül Hüsna</p>
        </div>
    </div>

    <!-- ANA SAYFA -->
    <div id="main-content" class="hidden">
        <!-- Header / Dini Resim Alanı -->
        <header class="hero-section">
            <div class="hero-overlay">
                <h1>Kalplere Huzur İlahiler</h1>
                <p>Allah'ın Güzel İsimleriyle Manevi Yolculuk</p>
            </div>
        </header>

        <!-- İçerik Alanı -->
        <main class="container">
            <section class="player-section">
                <h2 id="ilahi-title">Allah'ın 99 İsmi ve İlahi</h2>
                <div class="lyrics-box" id="lyrics-content">
                    <!-- İlahi sözleri buraya dinamik gelecektir -->
                </div>
                
                <!-- Ses / Kontroller -->
                <div class="controls">
                    <button id="play-btn" class="btn">İlahiyi Dinle / Oku</button>
                    <button id="next-btn" class="btn secondary">Sonraki Bölüm</button>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
