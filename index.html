<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huzur Pınarı - İlahiler ve Esmaül Hüsna</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- GİRİŞ ANİMASYONU (Instagram Tarzı) -->
    <div id="splash-screen">
        <div class="splash-content">
            <img src="watermarked_img_14307815405814033485.png" alt="Uygulama Logosu" class="splash-logo">
            <h1>Huzur Pınarı</h1>
            <p>Esmaül Hüsna & İlahiler</p>
        </div>
    </div>

    <!-- ANA SAYFA -->
    <div id="main-content" class="hidden">
        <header class="hero-section">
            <div class="hero-overlay">
                <h1>Kalplere Huzur İlahiler</h1>
                <p>Allah'ın Güzel İsimleriyle Manevi Yolculuk</p>
            </div>
        </header>

        <main class="container">
            <section class="player-section">
                <h2 id="ilahi-title">Allah'ın 99 İsmi ve İlahi</h2>
                
                <div class="lyrics-box" id="lyrics-content">
                    <!-- İlahi sözleri buraya gelecek -->
                </div>

                <div class="controls">
                    <button id="play-btn" class="btn">▶ İlahiyi Sesli Oku / Dinle</button>
                    <button id="next-btn" class="btn secondary">Sonraki Bölüm ➡</button>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
